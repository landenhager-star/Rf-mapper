<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RF Spectrum & GPS Mapper</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1f1f1f; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; }
    .btn { background: #007acc; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #005999; }
    .btn.active { background: #28a745; }
    .btn.danger { background: #c0392b; }
    .status { font-size: 13px; color: #aaa; }
    #main { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
    @media (min-width: 768px) { #main { flex-direction: row; } }
    #meters { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #181818; }
    .band-card { background: #242424; border-radius: 6px; padding: 10px; border-left: 5px solid #555; position: relative; transition: border-color 0.2s; }
    .band-card.burst { border-left-color: #ff3838; background: #2f1e1e; }
    .band-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
    .bar-bg { background: #333; height: 18px; border-radius: 9px; overflow: hidden; position: relative; }
    .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2ed573, #ffa502, #ff4757); transition: width 0.15s; }
    .bar-text { position: absolute; right: 8px; top: 1px; font-size: 11px; font-weight: bold; color: #fff; }
    .ping-badge { display: none; background: #ff3838; color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 3px; margin-left: 6px; }
    #map { flex: 1.2; min-height: 300px; background: #222; }
    #footer { background: #1f1f1f; padding: 8px 16px; font-size: 12px; display: flex; justify-content: space-between; border-top: 1px solid #333; }
  </style>
</head>
<body>

<header>
  <div>
    <strong>RF Spectrum & GPS Mapper</strong>
    <span class="status" id="gps-status">| GPS: Off</span>
    <span class="status" id="sdr-status">| SDR: Disconnected</span>
  </div>
  <div style="display: flex; gap: 6px; flex-wrap: wrap;">
    <button class="btn" id="btn-gps" onclick="toggleGPS()">Start GPS</button>
    <button class="btn" id="btn-sdr" onclick="connectSDR()">Connect RTL-SDR</button>
    <button class="btn" onclick="exportCSV()">Export CSV</button>
    <button class="btn" onclick="exportKML()">Export KML</button>
    <button class="btn danger" onclick="clearData()">Clear Map</button>
  </div>
</header>

<div id="main">
  <div id="meters"></div>
  <div id="map"></div>
</div>

<div id="footer">
  <span id="log-count">Points Logged: 0 | Burst Pings: 0</span>
  <span id="lock-status" style="color: #ff9f43;">Logging: Hardware Locked (Connect SDR)</span>
</div>

<script>
  const BANDS = [
    { id: 'vhf_low', name: 'Low VHF / Airband', centerMHz: 118, range: '50 - 137 MHz', baseline: -85 },
    { id: 'vhf_ham', name: 'VHF Marine / 2M Ham', centerMHz: 156, range: '144 - 174 MHz', baseline: -85 },
    { id: 'ism_sub', name: '315 / 433 MHz ISM Remotes', centerMHz: 433, range: '300 - 450 MHz', baseline: -85 },
    { id: 'uhf_gmrs', name: 'UHF / GMRS / Land Mobile', centerMHz: 462, range: '450 - 512 MHz', baseline: -85 },
    { id: 'cell_ism', name: '700 - 900 MHz Cell / ISM', centerMHz: 850, range: '700 - 960 MHz', baseline: -85 },
    { id: 'l_band', name: '1.2 - 1.7 GHz L-Band', centerMHz: 1420, range: '1200 - 1700 MHz', baseline: -85 }
  ];

  let map, markersLayer = null, currentPos = null, currentAlt = 0, loggedPoints = [], burstCount = 0;
  let gpsWatchId = null;
  let isHardwareLive = false;
  let scannerInterval = null;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playAlertBeep() {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch(e) {}
  }

  function initMap() {
    map = L.map('map').setView([50.1, -96.5], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);
  }

  function initMeters() {
    const container = document.getElementById('meters');
    container.innerHTML = BANDS.map(b => `
      <div class="band-card" id="card-${b.id}">
        <div class="band-header">
          <span>
            ${b.name} <small style="color:#888;">(~${b.centerMHz} MHz)</small>
            <span class="ping-badge" id="ping-${b.id}">PING DETECTED</span>
          </span>
          <span id="val-${b.id}">-85 dBm</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill" id="bar-${b.id}"></div>
          <span class="bar-text" id="peak-${b.id}">Hold: -85 dBm</span>
        </div>
      </div>
    `).join('');
  }

  function toggleGPS() {
    const btn = document.getElementById('btn-gps');
    const status = document.getElementById('gps-status');

    if (gpsWatchId) {
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
      btn.classList.remove('active');
      btn.innerText = 'Start GPS';
      status.innerText = '| GPS: Off';
      return;
    }

    if (!navigator.geolocation) { alert('No GPS hardware detected.'); return; }

    gpsWatchId = navigator.geolocation.watchPosition(
      pos => {
        currentPos = [pos.coords.latitude, pos.coords.longitude];
        currentAlt = pos.coords.altitude || 0;
        status.innerText = `| GPS: ±${Math.round(pos.coords.accuracy)}m`;
        btn.classList.add('active');
        btn.
