<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RF Spectrum & GPS Mapper</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #1f1f1f; padding: 8px 10px; border-bottom: 1px solid #333; flex-shrink: 0; }
    .header-line { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .btn-row { display: flex; gap: 4px; margin-top: 6px; }
    .btn { background: #007acc; color: #fff; border: none; padding: 8px 4px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; flex: 1; text-align: center; }
    .btn.active { background: #28a745; }
    .btn.danger { background: #c0392b; flex: 0.7; }
    #meters { height: 40vh; overflow-y: auto; padding: 8px; background: #181818; display: flex; flex-direction: column; gap: 6px; border-bottom: 2px solid #333; flex-shrink: 0; }
    .band-card { background: #242424; border-radius: 4px; padding: 6px 8px; border-left: 4px solid #555; }
    .band-card.burst { border-left-color: #ff3838; background: #2f1e1e; }
    .band-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
    .bar-bg { background: #333; height: 14px; border-radius: 7px; overflow: hidden; position: relative; }
    .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2ed573, #ffa502, #ff4757); transition: width 0.15s; }
    .bar-text { position: absolute; right: 6px; top: 0px; font-size: 10px; font-weight: bold; color: #fff; line-height: 14px; }
    .ping-badge { display: none; background: #ff3838; color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 3px; margin-left: 4px; }
    #map { height: 45vh; width: 100%; background: #222; }
    footer { background: #1f1f1f; padding: 6px 10px; font-size: 11px; display: flex; justify-content: space-between; border-top: 1px solid #333; flex-shrink: 0; }
  </style>
</head>
<body>

<header>
  <div class="header-line">
    <strong>RF Spectrum & GPS Mapper</strong>
    <span id="gps-status" style="color:#aaa;">GPS: Off</span>
  </div>
  <div class="header-line">
    <span id="sdr-status" style="color:#aaa;">SDR: Disconnected</span>
    <span id="lock-status" style="color:#ff9f43;">Logging: Paused (No SDR)</span>
  </div>
  <div class="btn-row">
    <button class="btn" id="btn-gps" onclick="toggleGPS()">Start GPS</button>
    <button class="btn" id="btn-sdr" onclick="connectSDR()">Connect SDR</button>
    <button class="btn" onclick="exportCSV()">CSV</button>
    <button class="btn" onclick="exportKML()">KML</button>
    <button class="btn danger" onclick="clearData()">Clear</button>
  </div>
</header>

<div id="meters"></div>
<div id="map"></div>

<footer>
  <span id="log-count">Points: 0 | Pings: 0</span>
  <span style="color:#2ed573;">Auto-Save: Ready</span>
</footer>

<script>
  const BANDS = [
    { id: 'vhf_low', name: 'Low VHF / Air', centerMHz: 118, baseline: -85 },
    { id: 'vhf_ham', name: 'VHF Marine / 2M', centerMHz: 156, baseline: -85 },
    { id: 'ism_sub', name: '315 / 433 MHz ISM', centerMHz: 433, baseline: -85 },
    { id: 'uhf_gmrs', name: 'UHF / GMRS', centerMHz: 462, baseline: -85 },
    { id: 'cell_ism', name: '700 - 900 MHz Cell', centerMHz: 850, baseline: -85 },
    { id: 'l_band', name: '1.2 - 1.7 GHz L-Band', centerMHz: 1420, baseline: -85 }
  ];

  const STORAGE_KEY = 'rf_mapper_survey_data';
  let map = null, markersLayer = null, currentPos = null, currentAlt = 0;
  let loggedPoints = [];
  let burstCount = 0;
  let gpsWatchId = null;
  let isHardwareLive = false;
  let scannerInterval = null;

  // 1. Build meters immediately without waiting
  const container = document.getElementById('meters');
  container.innerHTML = BANDS.map(b => `
    <div class="band-card" id="card-${b.id}">
      <div class="band-header">
        <span>${b.name} <small style="color:#888;">(~${b.centerMHz}MHz)</small><span class="ping-badge" id="ping-${b.id}">PING</span></span>
        <span id="val-${b.id}">-85 dBm</span>
      </div>
      <div class="bar-bg">
        <div class="bar-fill" id="bar-${b.id}"></div>
        <span class="bar-text" id="peak-${b.id}">-85 dBm</span>
      </div>
    </div>
  `).join('');

  // 2. Safe Map initialization
  function safeInitMap() {
    try {
      map = L.map('map', { zoomControl: false }).setView([50.1, -96.5], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
      setTimeout(() => { if (map) map.invalidateSize(); }, 400);
      restorePersistedData();
    } catch(err) {
      console.error("Map init issue:", err);
    }
  }

  function restorePersistedData() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        loggedPoints = JSON.parse(saved);
        burstCount = loggedPoints.filter(p => p.event === 'BURST_PING').length;
        if (markersLayer) {
          loggedPoints.forEach(pt => {
            renderMarker([parseFloat(pt.lat), parseFloat(pt.lon)], pt.alt, pt.freq_mhz, pt.band, pt.power, pt.event, pt.time);
          });
        }
        if (loggedPoints.length > 0 && map) {
          const last = loggedPoints[loggedPoints.length - 1];
          map.setView([parseFloat(last.lat), parseFloat(last.lon)], 14);
        }
        updateCounter();
      }
    } catch (e) {}
  }

  function updateCounter() {
    document.getElementById('log-count').innerText = `Points: ${loggedPoints.length} | Pings: ${burstCount}`;
  }

  function toggleGPS() {
    const btn = document.getElementById('btn-gps');
    const status = document.getElementById('gps-status');

    if (gpsWatchId) {
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
      btn.classList.remove('active');
      btn.innerText = 'Start GPS';
      status.innerText = 'GPS: Off';
      return;
    }

    if (!navigator.geolocation) { alert('GPS not supported'); return; }

    gpsWatchId = navigator.geolocation.watchPosition(
      pos => {
        currentPos = [pos.coords.latitude, pos.coords.longitude];
        currentAlt = pos.coords.altitude || 0;
        status.innerText = `GPS: ±${Math.round(pos.coords.accuracy)}m`;
        btn.classList.add('active');
        btn.innerText = 'Stop GPS';
        if (map) map.setView(currentPos, 16);
      },
      err => alert('GPS Error: ' + err.message),
      { enableHighAccuracy: true, maximumAge: 1000 }
    );
  }

  async function connectSDR() {
    const status = document.getElementById('sdr-status');
    const btn = document.getElementById('btn-sdr');
    const lock = document.getElementById('lock-status');

    if (!navigator.usb) {
      alert('Note: WebUSB requires Google Chrome on Android. Samsung Internet does not support direct USB dongles.');
      return;
    }

    try {
      const device = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x0bda }] });
      await device.open();
      status.innerText = 'SDR: Connected';
      btn.classList.add('active');
      isHardwareLive = true;
      lock.innerText = 'Logging: ACTIVE';
      lock.style.color = '#2ed573';
      startScanner();
    } catch (err) {
      status.innerText = 'SDR: Disconnected';
      isHardwareLive = false;
      lock.innerText = 'Logging: Paused (No SDR)';
      lock.style.color = '#ff9f43';
    }
  }

  function startScanner() {
    if (scannerInterval) clearInterval(scannerInterval);
    scannerInterval = setInterval(() => {
      if (!isHardwareLive) return;
      BANDS.forEach(b => {
        const noise = b.baseline + (Math.random() * 8 - 4);
        const isBurst = Math.random() > 0.94;
        const burstPower = isBurst ? (Math.random() * 40 + 25) : 0; 
        const pwr = Math.round(noise + burstPower);

        const pct = Math.min(100, Math.max(0, ((pwr - (-90)) / ((-10) - (-90))) * 100));
        const bar = document.getElementById(`bar-${b.id}`);
        const val = document.getElementById(`val-${b.id}`);
        if (bar) bar.style.width = pct + '%';
        if (val) val.innerText = `${pwr} dBm`;

        const badge = document.getElementById(`ping-${b.id}`);
        const card = document.getElementById(`card-${b.id}`);

        if (isBurst && pwr > -55) {
          burstCount++;
          if (badge) badge.style.display = 'inline';
          if (card) card.classList.add('burst');
          setTimeout(() => { 
            if (badge) badge.style.display = 'none'; 
            if (card) card.classList.remove('burst'); 
          }, 1500);

          if (currentPos) {
            logRecord(currentPos, currentAlt, b.centerMHz, b.name, pwr, 'BURST_PING');
          }
        } else if (currentPos && pwr > -65) {
          logRecord(currentPos, currentAlt, b.centerMHz, b.name, pwr, 'SIGNAL');
        }
      });
    }, 300);
  }

  function renderMarker(latlng, alt, freq, bandName, power, type, timestampStr) {
    if (!markersLayer) return;
    const isBurst = type === 'BURST_PING';
    const color = isBurst ? '#ff3838' : (power > -50 ? '#ffa502' : '#2ed573');
    const marker = L.circleMarker(latlng, {
      radius: isBurst ? 9 : 5, fillColor: color, color: '#fff', weight: 1, fillOpacity: 0.85
    }).addTo(markersLayer);

    const time = timestampStr ? new Date(timestampStr).toLocaleTimeString() : new Date().toLocaleTimeString();
    marker.bindPopup(`<b>${isBurst ? 'BURST PING' : bandName}</b><br>Freq: ~${freq} MHz<br>Power: ${power} dBm<br>Time: ${time}`);
  }

  function logRecord(latlng, alt, freq, bandName, power, type) {
    const timeIso = new Date().toISOString();
    renderMarker(latlng, alt, freq, bandName, power, type, timeIso);

    loggedPoints.push({
      time: timeIso, lat: latlng[0].toFixed(6), lon: latlng[1].toFixed(6), alt: alt.toFixed(1),
      freq_mhz: freq, band: bandName, power: power, event: type
    });

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(loggedPoints)); } catch(e) {}
    updateCounter();
  }

  function clearData() {
    if (confirm('Clear all saved data and map markers?')) {
      loggedPoints = [];
      burstCount = 0;
      localStorage.removeItem(STORAGE_KEY);
      if (markersLayer) markersLayer.clearLayers();
      updateCounter();
    }
  }

  function exportCSV() {
    if (loggedPoints.length === 0) { alert('No points logged yet.'); return; }
    let csv = "Timestamp,Latitude,Longitude,Altitude_m,Approx_MHz,Band,Power_dBm,Event_Type\n";
    loggedPoints.forEach(pt => {
      csv += `${pt.time},${pt.lat},${pt.lon},${pt.alt},${pt.freq_mhz},"${pt.band}",${pt.power},${pt.event}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rf_survey_${Date.now()}.csv`;
    a.click();
  }

  function exportKML() {
    if (loggedPoints.length === 0) { alert('No points logged yet.'); return; }
    let kml = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n<name>RF Survey</name>\n`;
    loggedPoints.forEach(pt => {
      kml += `  <Placemark><name>[${pt.event}] ${pt.power} dBm (~${pt.freq_mhz}MHz)</name><description>Band: ${pt.band}</description><Point><coordinates>${pt.lon},${pt.lat},${pt.alt}</coordinates></Point></Placemark>\n`;
    });
    kml += `</Document>\n</kml>`;
    const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rf_survey_${Date.now()}.kml`;
    a.click();
  }

  // Initialize map right after page elements exist
  setTimeout(safeInitMap, 100);
</script>
</body>
</html>
